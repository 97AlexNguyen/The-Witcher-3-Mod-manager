[project]
name = "TW3MM"
version = "0.9.4-beta.2"
description = "Enhanced Mod Manager for The Witcher 3 with Nexus API integration"
authors = [
    { name = "Stefan Kostic", email = "stekos@live.com" },
    { name = "Christian Sdunek", email = "me@systemcluster.me" },
    { name = "Adam Sunderman", email = "amsunderman@gmail.com" },
    { name = "Henry Hsieh", email = "r901042004@yahoo.com.tw" },
    { name = "George Burduli", email = "burduli01@pm.me" },
    { name = "Vincent", email = "97nguyenvuquocan@gmail.com" }
]
dependencies = [
    # Core Qt GUI framework
    "pyside6>=6.5.0",
    
    # File system operations and locking
    "fasteners>=0.18",
    "watchdog>=3.0.0",
    
    # Text and encoding handling
    "charset-normalizer>=3.0.0",
    
    # Web scraping and HTTP requests
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    
    # Data serialization
    "pyyaml>=6.0",
    
    # Scheduling and automation
    "schedule>=1.2.0",
    
    # Windows-specific dependencies
    "pywin32>=304; sys_platform == 'win32'",
    "colorama>=0.4.0; sys_platform == 'win32'",
]
readme = "Readme.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10,<3.13"

[project.urls]
Repository = "https://github.com/Systemcluster/The-Witcher-3-Mod-manager.git"
NexusMods = "https://www.nexusmods.com/witcher3/mods/2678"
Homepage = "https://www.nexusmods.com/witcher3/mods/2678"

[project.scripts]
tw3mm = "main:main"

[project.gui-scripts] 
tw3mm-gui = "main:main"

[project.optional-dependencies]
# Development dependencies
dev = [
    "pylint>=2.17.0",
    "mypy>=1.5.0", 
    "autopep8>=2.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pyinstaller>=5.13.0",
]

# Archive support (optional)
archive = [
    "py7zr>=0.20.0",
    "rarfile>=4.1",
]

# Testing dependencies  
test = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-mock>=3.11.0",
]

[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
dev = [
    "pylint>=2.17.0",
    "mypy>=1.5.0",
    "autopep8>=2.0.0", 
    "black>=23.0.0",
    "isort>=5.12.0",
    "pyinstaller>=5.13.0",
]

[tool.pdm.scripts]
# === DEVELOPMENT SCRIPTS ===
start = "python main.py"
debug = "python main.py --debug"

# === CLEAN INSTALLATION ===
# Clean install để tránh conflicts
clean-install = """
pip uninstall -y patool patoolib py7zr rarfile &&
pdm install --no-lock
"""

# === MODERN BUILD SCRIPTS (PyInstaller) ===
# Build Windows executable với PyInstaller
build = "pyinstaller tw3mm.spec"
build-debug = "pyinstaller --debug=all tw3mm.spec"

# Quick build cho development (single command)
build-dev = """
pyinstaller --onefile --windowed --name="TheWitcher3ModManager" --icon="res/w3a.ico" --add-data="res;res" --add-data="translations;translations" --add-data="tools;tools" --add-data="mapping;mapping" --add-data="api;api" --add-data="src;src" --hidden-import="PySide6.QtCore" --hidden-import="PySide6.QtWidgets" --hidden-import="PySide6.QtGui" --exclude-module="tkinter" --exclude-module="matplotlib" main.py
"""

# Build với full optimization
build-release = """
pyinstaller --onefile --windowed --optimize=2 --name="TheWitcher3ModManager" --icon="res/w3a.ico" --add-data="res;res" --add-data="translations;translations" --add-data="tools;tools" --add-data="mapping;mapping" --add-data="api;api" --add-data="src;src" --hidden-import="PySide6.QtCore" --hidden-import="PySide6.QtWidgets" --hidden-import="PySide6.QtGui" --exclude-module="tkinter" --exclude-module="matplotlib" --exclude-module="PIL" --distpath="dist/release" main.py
"""

# Build với directory structure (faster startup)
build-dir = """
pyinstaller --windowed --name="TheWitcher3ModManager" --icon="res/w3a.ico" --add-data="res;res" --add-data="translations;translations" --add-data="tools;tools" --add-data="mapping;mapping" --add-data="api;api" --add-data="src;src" --hidden-import="PySide6.QtCore" --hidden-import="PySide6.QtWidgets" --hidden-import="PySide6.QtGui" --exclude-module="tkinter" --exclude-module="matplotlib" main.py
"""

# Build portable single file
build-portable = """
pyinstaller --onefile --windowed --name="TW3MM-Portable" --icon="res/w3a.ico" --add-data="res;res" --add-data="translations;translations" --add-data="tools;tools" --add-data="mapping;mapping" --add-data="api;api" --add-data="src;src" --runtime-tmpdir="." main.py
"""

# === LEGACY BUILD (cx-freeze backup) ===
build-legacy = "python setup.py build_exe"

# === UTILITY SCRIPTS ===
# Clean build artifacts
clean = """
python -c "import shutil, os; [shutil.rmtree(d, ignore_errors=True) for d in ['build', 'dist', '__pycache__'] if os.path.exists(d)]; print('Cleaned build artifacts')"
"""

# Create PyInstaller spec file
create-spec = """
pyi-makespec --onefile --windowed --name="TheWitcher3ModManager" --icon="res/w3a.ico" --add-data="res;res" --add-data="translations;translations" --add-data="tools;tools" --add-data="mapping;mapping" --add-data="api;api" --add-data="src;src" main.py
"""

# === DEVELOPMENT TOOLS ===
lint = "pylint src/"
format = "black src/ && isort src/"
type-check = "mypy src/"

# === TESTING ===
test = "pytest tests/ -v"
test-gui = "pytest tests/ --qt-no-window -v"

# === UTILITIES ===
setup-api = "python api/setup_api.py"
update-categories = "python api/get_category.py"

# Sync version between pyproject.toml và constants.py
sync-version = """
python -c "
import re
from pathlib import Path

# Read version from pyproject.toml
pyproject = Path('pyproject.toml').read_text()
version = re.search(r'version = \"([^\"]+)\"', pyproject).group(1)

# Update constants.py
constants_file = Path('src/globals/constants.py')
content = constants_file.read_text()
updated = re.sub(r'VERSION = \"[^\"]+\"', f'VERSION = \"{version}\"', content)
constants_file.write_text(updated)

print(f'Synced version to {version}')
"
"""

# Fix dependencies
fix-deps = """
pip uninstall -y patool patoolib &&
pip install py7zr rarfile &&
echo "Dependencies fixed!"
"""

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

# === DEVELOPMENT TOOLS CONFIG ===
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | translations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "invalid-name", 
    "too-few-public-methods",
    "too-many-arguments",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "fasteners.*", 
    "watchdog.*",
    "yaml.*",
    "requests.*",
    "bs4.*",
]
ignore_missing_imports = true